[tool.poetry]
package-mode = false

[project]
name = "cattle-log"
version = "0.1.0"
description = "Sistema de gestão de rebanho"
authors = [
    { name = "Gabriel Bitti", email = "gabrielbitti0@gmail.com" }
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "alembic (==1.17.1)",
    "fastapi (==0.121.0)",
    "jinja2 (==3.1.6)",
    "prettyconf (==2.3.0)",
    "psycopg2-binary (==2.9.11)",
    "pydantic (==2.12.3)",
    "python-dotenv (==1.2.1)",
    "sqlalchemy (==2.0.44)",
    "uvicorn[standard] (==0.38.0)"
]


[tool.poe.tasks]
dev = "uvicorn main:app --host 0.0.0.0 --port 8008 --reload"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "poethepoet (>=0.46.0,<0.47.0)"
]
